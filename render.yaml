# Render Blueprint: the public site as a free static site, without the Node server.
# Generated by scripts/render-yaml.js (npm run render:yaml). Edit the script, not this file.
# Forms work in e-mail mode here; online sending and the admin panel need the Node server.
services:
  - type: web
    name: qadoqlab
    runtime: static
    buildCommand: node src/build.js
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: STATIC_HOSTING
        value: "true"
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-P2iQqoislY2yJYYx94cOfnGrRmWejIjDrzZpcORFnsU='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; form-action 'self' mailto:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: "same-origin"
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: "none"
      - path: /*
        name: Origin-Agent-Cluster
        value: "?1"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
